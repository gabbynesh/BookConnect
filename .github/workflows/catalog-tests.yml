name: Catalog tests
on:
  push:
    branches: [stage-3-improvements, main]
  pull_request:
permissions:
  contents: read
jobs:
  catalog-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/catalog.test.cjs
